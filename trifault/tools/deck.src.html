<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does Lean say that? · TriFault</title>
<link rel="stylesheet" href="vendor/reveal/reset.css">
<link rel="stylesheet" href="vendor/reveal/reveal.css">
<link rel="stylesheet" href="css/deck.css">
<script>
  // ?export → static mode for decktape: 3D becomes its PNG poster, fragments are all shown.
  window.DECK_EXPORT = /[?&]export\b/.test(location.search);
</script>
<script type="module" src="vendor/model-viewer/model-viewer.min.js"></script>
</head>
<body>
<div class="reveal"><div class="slides">

<!--slides-->

</div></div>

<script src="vendor/reveal/reveal.js"></script>
<script src="vendor/reveal/plugin/notes/notes.js"></script>
<script>
  // Self-hosted decoders so model-viewer never reaches a CDN.
  customElements.whenDefined('model-viewer').then(() => {
    const MV = customElements.get('model-viewer');
    MV.dracoDecoderLocation = 'vendor/decoders/draco/';
    MV.ktx2TranscoderLocation = 'vendor/decoders/basis/';
  });

  // Slide numbers in the footer.
  document.querySelectorAll('.reveal .slides > section').forEach((s, i) => {
    const n = s.querySelector('.ft .n'); if (n) n.textContent = i + 1;
  });

  // Mark any render or model that is missing (assets/ not unzipped yet).
  function markMissing(panel, src) { panel.classList.add('missing'); panel.dataset.src = src; }
  document.querySelectorAll('.panel img').forEach(img => {
    img.addEventListener('error', () => markMissing(img.parentElement, img.getAttribute('src')));
    if (img.complete && !img.naturalWidth) markMissing(img.parentElement, img.getAttribute('src'));
  });
  document.querySelectorAll('.panel model-viewer').forEach(mv => {
    mv.addEventListener('error', () => markMissing(mv.parentElement, mv.getAttribute('src')));
  });

  if (window.DECK_EXPORT) {
    // PDF: each 3D model becomes its PNG poster; every fragment is shown.
    document.querySelectorAll('model-viewer').forEach(mv => {
      const img = document.createElement('img');
      img.src = mv.getAttribute('poster'); img.alt = mv.getAttribute('alt') || '';
      img.addEventListener('error', () => img.parentElement && markMissing(img.parentElement, img.getAttribute('src')));
      mv.replaceWith(img);
    });
    document.querySelectorAll('.fragment').forEach(f => f.classList.remove('fragment'));
  }

  Reveal.initialize({
    width: 1920, height: 1080, margin: 0, minScale: 0.1, maxScale: 3,
    center: false, transition: 'fade', backgroundTransition: 'fade',
    controls: false, progress: false, slideNumber: false,
    hash: true, history: false, pdfSeparateFragments: false,
    plugins: [ RevealNotes ]
  });
</script>
</body>
</html>
