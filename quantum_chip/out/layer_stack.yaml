die:
  name: quantum_die.gds
  size_mm:
  - 10.0
  - 10.0
  layers:
  - name: die_attach
    source: chip box
    material: GE 7031 varnish, 20 um
    true_thickness_mm: 0.02
    true_thickness_nm: 20000.0
    visual_thickness_mm: 0.02
    z_mm:
    - 0.911
    - 0.931
  - name: die_substrate
    source: chip box
    material: high-resistivity Si(100), >10 kOhm.cm
    true_thickness_mm: 0.525
    true_thickness_nm: 525000.0
    visual_thickness_mm: 0.525
    z_mm:
    - 0.931
    - 1.456
  - name: die_Al_film
    source: KQC 130/1 base_metal_gap_wo_grid (inverted) + 131/1 base_metal_addition - 158/1 dicing
    material: 'Al 200 nm base metal: ground plane, CPWs, qubit islands, resonators (thickness x15 for display)'
    true_thickness_mm: 0.00019999999999999998
    true_thickness_nm: 200.0
    visual_thickness_mm: 0.003
    z_mm:
    - 1.456
    - 1.459
  - name: jj_bottom_Al
    source: KQC 136/1 SIS_junction
    material: Manhattan JJ / SQUID bottom electrode (display x60)
    true_thickness_mm: 3.9999999999999996e-05
    true_thickness_nm: 40.0
    visual_thickness_mm: 0.0025
    z_mm:
    - 1.456
    - 1.4585
  - name: jj_AlOx
    source: overlap 136/1 AND 139/1
    material: AlOx tunnel barrier = overlap of the two electrodes
    true_thickness_mm: 1.5e-06
    true_thickness_nm: 1.5
    visual_thickness_mm: 0.0006
    z_mm:
    - 1.4585
    - 1.4591
  - name: jj_top_Al
    source: KQC 139/1 SIS_junction_2
    material: JJ / SQUID top electrode (display x30)
    true_thickness_mm: 7.999999999999999e-05
    true_thickness_nm: 80.0
    visual_thickness_mm: 0.0025
    z_mm:
    - 1.4591
    - 1.4616
  - name: airbridges_Al
    source: KQC 146/1 airbridge_pads + 147/1 airbridge_flyover
    material: ground-strap airbridges across CPWs, 3 um span height
    true_thickness_mm: 0.0006
    true_thickness_nm: 600.0
    visual_thickness_mm: 0.0042
    z_mm:
    - 1.459
    - 1.4632
package:
  base: OFHC copper, 2 um Au over 2 um Ni (non-magnetic would use Ag)
  base_thickness_mm: 4.0
  die_attach: GE 7031 varnish, 20 um
  wirebond: Al-1%Si wedge bond, 25 um
  wire_diameter_um: 25.0
  loop_height_um: 180.0
visual_exaggeration_note: Films thinner than 3 um are drawn thicker in the 3D model so they are visible; true_thickness is
  the fabrication value, visual_thickness the mesh value. XY geometry is never altered.
