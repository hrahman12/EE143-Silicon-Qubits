    true_thickness_nm: 100.0
    visual_thickness_mm: 0.0015
    z_mm:
    - 1.4635
    - 1.465
  - name: die_ILD1_SiO2
    source: sheet (5/0 = contacts)
    material: SiO2 ILD (sheet) / via M1-M2 (200 nm; drawn 2000 nm)
    true_thickness_mm: 0.00019999999999999998
    true_thickness_nm: 200.0
    visual_thickness_mm: 0.002
    z_mm:
    - 1.4635
    - 1.4655
