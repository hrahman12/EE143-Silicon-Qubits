  wirebond: Al-1%Si wedge bond, 25 um
  wire_diameter_um: 25.0
  loop_height_um: 180.0
visual_exaggeration_note: Films thinner than 3 um are drawn thicker in the 3D model so they are visible; true_thickness is
  the fabrication value, visual_thickness the mesh value. XY geometry is never altered.
