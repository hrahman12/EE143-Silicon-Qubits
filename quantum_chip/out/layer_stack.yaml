    true_thickness_nm: 300.0
    visual_thickness_mm: 0.004
    z_mm:
    - 1.4655
    - 1.4695
  - name: die_pad_Au
    source: 8/0 PAD
    material: Ti/Au bond-pad metallisation (100 nm; drawn 1500 nm)
    true_thickness_mm: 9.999999999999999e-05
    true_thickness_nm: 100.0
    visual_thickness_mm: 0.0015
    z_mm:
    - 1.4695
    - 1.471
  - name: die_vias_Nb
    source: 9/0 VIA + 5/0 I1
    material: stacked GP contacts (JJ ground straps, resistor returns, ring fence) + I1 contacts
    true_thickness_mm: 0.00039999999999999996
    true_thickness_nm: 400.0
    visual_thickness_mm: 0.0065
    z_mm:
    - 1.459
    - 1.4655
  process: Nb/AlOx/Nb trilayer, GP + 2 wiring layers (SFQ5ee-like, simplified)
  junctions: 3270
package:
  base: OFHC copper, 2 um Au over 2 um Ni (non-magnetic would use Ag)
  base_thickness_mm: 4.0
  die_attach: GE 7031 varnish, 20 um
  wirebond: Al-1%Si wedge bond, 25 um
  wire_diameter_um: 25.0
  loop_height_um: 180.0
visual_exaggeration_note: Films thinner than 3 um are drawn thicker in the 3D model so they are visible; true_thickness is
  the fabrication value, visual_thickness the mesh value. XY geometry is never altered.
