    material: Nb ground plane M0 (200 nm; drawn 3000 nm)
    true_thickness_mm: 0.00019999999999999998
    true_thickness_nm: 200.0
    visual_thickness_mm: 0.003
    z_mm:
    - 1.456
    - 1.459
  - name: die_ILD0_SiO2
    source: sheet (not drawn)
    material: SiO2 ILD (sheet) / via GP-M1 (200 nm; drawn 2000 nm)
    true_thickness_mm: 0.00019999999999999998
    true_thickness_nm: 200.0
    visual_thickness_mm: 0.002
    z_mm:
    - 1.459
    - 1.461
