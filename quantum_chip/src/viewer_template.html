<meta charset="utf-8">
<title>Q4 Flux Chip Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage, a layer rail on the left like a CAD layer manager, a property readout bottom-right. */
:root {
  --bg: #e9ebee; --panel: #f7f8fa; --line: #cdd2d9; --fg: #15191f; --muted: #5a6370;
  --accent: #c8202a; --gold: #a8801c; --stage: #dfe3e8;
  --f-display: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1014; --panel: #151a20; --line: #2a323c; --fg: #e6e9ed; --muted: #8b95a2;
  --accent: #ff4a4f; --gold: #e2b54a; --stage: #0b0e12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1014; --panel: #151a20; --line: #2a323c; --fg: #e6e9ed; --muted: #8b95a2;
  --accent: #ff4a4f; --gold: #e2b54a; --stage: #0b0e12; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 13px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 12px var(--f-body); padding: 6px 11px; background: transparent; color: var(--fg); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.spacer { flex: 1; }
.ctl { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.ctl input[type=range] { width: 120px; accent-color: var(--accent); }
button.plain { font: 500 12px var(--f-body); padding: 6px 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-width: 0;
  padding-block: 10px 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.grp { margin-bottom: 12px; }
.grp h2 { display: flex; align-items: center; gap: 8px; font: 600 11px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.grp h2 button { margin-left: auto; font: 500 10px var(--f-mono); border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.row { display: grid; grid-template-columns: 16px 12px 1fr auto; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.row input { margin: 0; accent-color: var(--accent); }
.sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); }
.row .nm { font-family: var(--f-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .th { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
main { position: relative; min-width: 0; background: var(--stage); }
canvas { display: block; width: 100%; height: 100%; }
.readout { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 24px));
  background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; backdrop-filter: blur(6px); }
.readout h3 { margin: 0 0 6px; font: 600 14px var(--f-display); letter-spacing: .03em; }
.readout dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12px; }
.readout dt { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.readout dd { margin: 0; font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 12px; top: 10px; color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.views { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 400px); }
.load { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-family: var(--f-mono); }
.load .box { max-width: 420px; padding: 16px; line-height: 1.6; }
.note { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 14px; }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 58vh auto; height: auto; }
  main { grid-row: 2; height: 58vh; }
  aside { grid-row: 3; border-right: 0; border-top: 1px solid var(--line); max-height: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .views { max-width: calc(100% - 24px); bottom: auto; top: 30px; }
  .readout { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Q4<span>·</span>Flux carrier</h1>
    <span class="sub">4× SQUID transmon die · 6-layer RO4003C carrier · 1 unit = 1 mm</span>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Display mode">
      <button id="m-real" aria-pressed="true">Fabrication</button>
      <button id="m-eng" aria-pressed="false">Engineering</button>
    </div>
    <label class="ctl" for="explode">Explode <input id="explode" type="range" min="0" max="3" step="0.01" value="0"></label>
    <label class="ctl" for="cut">Section&nbsp;cut <input id="cut" type="range" min="-21" max="21" step="0.05" value="21"></label>
    <button class="plain" id="rotate" aria-pressed="false">Auto-rotate</button>
  </header>
  <aside id="layers" aria-label="Layers"></aside>
  <main id="stage">
    <div class="hint">drag: orbit · right-drag: pan · wheel: zoom · click a part to inspect</div>
    <div class="views" id="views"></div>
    <div class="readout" id="readout"><h3>Assembly</h3><dl id="props"><dt>select</dt><dd>click any layer or part</dd></dl></div>
    <div class="load" id="loading"><div class="box">Loading assembly.glb …</div></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const MANIFEST = /*MANIFEST*/null;
const L = Object.fromEntries(MANIFEST.layers.map(l => [l.name, l]));
const SAN = Object.fromEntries(MANIFEST.layers.map(l => [l.name.replace(/\s/g, "_").replace(/[\[\]\.:\/]/g, ""), l.name]));
const GROUPS = [["die", "Quantum die"], ["bonds", "Wire bonds"], ["pcb", "RF carrier PCB"], ["vias", "Vias"], ["connectors", "Connectors + solder"], ["package", "Package"]];
const REAL = {
  copper: [0xd9926a, 1, .3], gold: [0xf2c25a, 1, .22], soldermask_red: [0x4a0508, 0, .32],
  soldermask_red_over_cu: [0xa8161c, .2, .3], rogers_ro4003c: [0xd8ceb4, 0, .75], rogers_ro4450f: [0xcfc3a6, 0, .8],
  silkscreen: [0xf0f0ea, 0, .6], silicon: [0x1d2230, .4, .12], aluminium: [0xe6e8ea, 1, .16], alox: [0xc8d6ff, 0, .1],
  aluminium_wire: [0xd0d2d4, 1, .35], ge_varnish: [0xa8651e, 0, .4], stainless: [0xb4b2ac, 1, .26],
  ptfe: [0xf2f2ee, 0, .5], solder: [0xd4d8dc, 1, .2], gold_plated_copper: [0xf0c46a, 1, .3],
};

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-40, 80, 50); scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.5));
const clip = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 21);   // keep x < cut

function bg() { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--stage").trim() || "#0b0e12"); }
bg(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", bg);
new MutationObserver(bg).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

const nodes = {};
let mode = "real", selected = null;
function makeMats(name) {
  const l = L[name]; const r = REAL[l.material] || [0x999999, 0, .5];
  const real = new THREE.MeshStandardMaterial({ color: r[0], metalness: r[1], roughness: r[2], clippingPlanes: [clip], side: THREE.DoubleSide, flatShading: !/bond|sma|smp|pins|ptfe|solder|screws/.test(name) });
  if (l.material === "rogers_ro4003c" || l.material === "rogers_ro4450f") { real.transparent = false; }
  const a = l.eng_opacity ?? 1;
  const eng = new THREE.MeshStandardMaterial({ color: new THREE.Color(l.eng_color), metalness: 0, roughness: .55,
    emissive: new THREE.Color(l.eng_color), emissiveIntensity: a === 1 && (l.group === "pcb" || l.group === "vias") ? .35 : .05,
    transparent: a < 1, opacity: a < .3 ? .12 : a, depthWrite: a >= 1, clippingPlanes: [clip], side: THREE.DoubleSide });
  return { real, eng };
}
function applyMode() {
  for (const [n, o] of Object.entries(nodes)) o.mesh.material = o.mats[mode];
  if (mode === "eng") for (const n of ["F.Mask", "F.Mask_over_Cu", "B.Mask", "B.Mask_over_Cu", "F.Silk", "B.Silk"]) setVis(n, false);
  else for (const n of ["F.Mask", "F.Mask_over_Cu", "B.Mask", "B.Mask_over_Cu", "F.Silk", "B.Silk"]) setVis(n, true);
  document.getElementById("m-real").setAttribute("aria-pressed", mode === "real");
  document.getElementById("m-eng").setAttribute("aria-pressed", mode === "eng");
}
function setVis(n, v) { if (!nodes[n]) return; nodes[n].mesh.visible = v; const cb = document.getElementById("cb-" + cssId(n)); if (cb) cb.checked = v; }
const cssId = n => n.replace(/[^a-zA-Z0-9]/g, "_");
const fmt = mm => mm >= 0.01 ? mm.toFixed(3) + " mm" : (mm * 1e6 >= 1000 ? (mm * 1000).toFixed(1) + " µm" : (mm * 1e6).toFixed(1) + " nm");

function buildPanel() {
  const aside = document.getElementById("layers");
  for (const [g, title] of GROUPS) {
    const ls = MANIFEST.layers.filter(l => l.group === g).sort((a, b) => b.z[1] - a.z[1]);
    if (!ls.length) continue;
    const d = document.createElement("div"); d.className = "grp";
    d.innerHTML = `<h2>${title}<button data-g="${g}" aria-label="Toggle all ${title}">all / none</button></h2>`;
    for (const l of ls) {
      const r = document.createElement("label"); r.className = "row"; r.dataset.n = l.name;
      r.innerHTML = `<input type="checkbox" id="cb-${cssId(l.name)}" checked><span class="sw" style="background:${l.eng_color}"></span><span class="nm">${l.name}</span><span class="th">${fmt(l.true_thickness_mm)}</span>`;
      r.querySelector("input").addEventListener("change", e => { if (nodes[l.name]) nodes[l.name].mesh.visible = e.target.checked; });
      r.addEventListener("click", e => { if (e.target.tagName !== "INPUT") { e.preventDefault(); select(l.name); } });
      d.appendChild(r);
    }
    d.querySelector("h2 button").addEventListener("click", () => {
      const any = ls.some(l => nodes[l.name]?.mesh.visible); ls.forEach(l => setVis(l.name, !any));
    });
    aside.appendChild(d);
  }
  const note = document.createElement("p"); note.className = "note";
  note.textContent = "Thickness column = fabrication value. Films under 3 µm are drawn thicker so they can be seen; XY geometry is the exported GDS / KiCad copper, unchanged.";
  aside.appendChild(note);
}
function select(n) {
  selected = n;
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.n === n));
  const l = L[n]; if (!l) return;
  document.querySelector("#readout h3").textContent = n;
  document.getElementById("props").innerHTML =
    `<dt>group</dt><dd>${l.group}</dd><dt>z range</dt><dd>${l.z[0].toFixed(4)} … ${l.z[1].toFixed(4)} mm</dd>` +
    `<dt>thickness</dt><dd>${fmt(l.true_thickness_mm)}${Math.abs(l.true_thickness_mm - l.visual_thickness_mm) > 1e-6 ? ` (drawn ${fmt(l.visual_thickness_mm)})` : ""}</dd>` +
    `<dt>material</dt><dd>${l.material.replace(/_/g, " ")}</dd><dt>triangles</dt><dd>${l.triangles.toLocaleString()}</dd>` +
    (l.note ? `<dt>note</dt><dd style="font-family:var(--f-body)">${l.note}</dd>` : "");
  for (const [k, o] of Object.entries(nodes)) {
    const m = o.mats[mode]; if (m.emissive && mode === "real") m.emissive.setHex(k === n ? 0x331010 : 0x000000);
  }
}

const VIEWS = {
  "Assembly": [[-42, 46, 58], [0, 0.5, 0]],
  "Top routing": [[0, 70, 0.01], [0, 0, 0]],
  "Bottom": [[-30, -40, 36], [0, -1, 0]],
  "Die": [[-6, 9, 9], [0, 1.4, 0]],
  "Qubit": [[0.3, 2.1, -2.6], [-0.8, 1.45, -1.0]],
  "Wire bonds": [[-1.3, 3.2, -8.1], [-1.2, 1.45, -5.0]],
};
let tween = null;
function goView(name) {
  const [p, t] = VIEWS[name];
  tween = { t0: performance.now(), from: [camera.position.clone(), controls.target.clone()], to: [new THREE.Vector3(...p), new THREE.Vector3(...t)] };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) tween.t0 -= 1e4;
}
const vbox = document.getElementById("views");
for (const v of Object.keys(VIEWS)) { const b = document.createElement("button"); b.className = "plain"; b.textContent = v; b.onclick = () => goView(v); vbox.appendChild(b); }

const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(Object.values(nodes).filter(o => o.mesh.visible).map(o => o.mesh))
    .filter(h => clip.distanceToPoint(h.point) >= 0);
  if (hits.length) select(hits[0].object.userData.layer);
});

document.getElementById("m-real").onclick = () => { mode = "real"; applyMode(); if (selected) select(selected); };
document.getElementById("m-eng").onclick = () => { mode = "eng"; applyMode(); if (selected) select(selected); };
const ex = document.getElementById("explode");
ex.oninput = () => { for (const o of Object.values(nodes)) o.mesh.position.y = (o.l.explode || 0) * ex.value; };
const cut = document.getElementById("cut");
cut.oninput = () => { clip.constant = +cut.value; };
const rot = document.getElementById("rotate");
rot.onclick = () => { controls.autoRotate = !controls.autoRotate; rot.setAttribute("aria-pressed", controls.autoRotate); };
controls.autoRotateSpeed = 1.2;

async function loadGLB(buf) {
  const gltf = await new GLTFLoader().parseAsync(buf, "");
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    // GLTFLoader sanitizes node names (drops "." etc.), so match on the sanitized form
    const name = SAN[o.name] || SAN[o.name.replace(/_\d+$/, "")] || SAN[o.parent?.name];
    if (!name) return;
    o.geometry.computeVertexNormals();
    const mats = makeMats(name);
    o.userData.layer = name;
    nodes[name] = { mesh: o, mats, l: L[name] };
  });
  scene.add(gltf.scene);
  buildPanel(); applyMode();
  camera.position.set(...VIEWS["Assembly"][0]); controls.target.set(...VIEWS["Assembly"][1]);
  document.getElementById("loading").hidden = true;
  select("die_Al_film");
}
fetch("assembly.glb").then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(loadGLB).catch(() => {
  document.querySelector("#loading .box").innerHTML = `assembly.glb could not be fetched (opened from disk?).<br>Serve the folder (<code>python3 -m http.server</code>) or pick the file:<br><br><input type="file" id="glbfile" accept=".glb">`;
  document.getElementById("glbfile").onchange = async e => { const f = e.target.files[0]; if (f) loadGLB(await f.arrayBuffer()); };
});

function loop(t) {
  if (tween) {
    const k = Math.min(1, (t - tween.t0) / 900), s = k * k * (3 - 2 * k);
    camera.position.lerpVectors(tween.from[0], tween.to[0], s); controls.target.lerpVectors(tween.from[1], tween.to[1], s);
    if (k >= 1) tween = null;
  }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
resize(); requestAnimationFrame(loop);
</script>
